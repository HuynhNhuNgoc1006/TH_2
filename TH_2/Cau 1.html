<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: 'Roboto', sans-serif;
        background-color: #f0f8ff;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100;
    }
    
    .container {
        text-align: center;
    }
    
    .profile {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 300px;
    }
    
    .avatar {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 3px solid #007bff;
        margin-bottom: 15px;
    }
    
    p {
        color: #666;
        font-size: 14px;
    }
    
    #h1 {
        color: #333;
        margin: 10px 0;
    }
</style>

<body>
    <div class="container">
        <div class="profile">
            <h1 id="h1">Thông tin cá nhân</h1>
            <p>Họ tên: Huỳnh Như Ngọc</p>
            <p>Năm sinh: 2005</p>
            <img src="https://res.cloudinary.com/djb3tnyx0/image/upload/v1749026032/61cc1b391220a67eff31_1_as0mil.jpg" alt="Ảnh đại diện" class="avatar">
        </div>
    </div>

</body>

</html>
